<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金ETF信号看板</title>
<style>
  :root {
    --bg: #faf9f7; --ink: #1c1b1a; --ink2: #57534e; --ink3: #8a8580; --ink4: #b5b0aa;
    --line: #e6e2dc; --card: #ffffff; --up: #d92d20; --down: #12805c; --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    padding: 24px 16px 40px;
  }
  .page { max-width: 1060px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  header.top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  header.top h1 { font-size: 21px; font-weight: 600; }
  header.top .meta { font-size: 12px; color: var(--ink3); }

  .grid { display: grid; grid-template-columns: 7fr 5fr; gap: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }

  .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .price { font-size: 36px; font-weight: 600; }
  .chg { font-size: 14px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink2); }
  .hero .state { font-size: 12px; color: var(--ink3); }
  .card h2 { font-size: 13px; font-weight: 500; color: var(--ink3); margin-bottom: 8px; }

  #chart { width: 100%; display: block; margin-top: 12px; }
  .grid-line { stroke: var(--line); stroke-width: 1; }
  .axis-text { fill: var(--ink4); font-size: 10px; }
  .price-line { stroke: var(--ink); stroke-width: 2; fill: none; }
  .ma20-line { stroke: var(--accent); stroke-width: 1.5; fill: none; }
  .ma60-line { stroke: var(--ink4); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  .last-label { font-size: 10.5px; font-weight: 600; }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--ink3); }
  .legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .sharp { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card2, rgba(0,0,0,0.02)); font-size: 12.5px; }
  .sharp .tag { font-size: 11px; color: var(--ink3); white-space: nowrap; }
  .sharp .v { font-weight: 700; }
  .sharp .note { color: var(--ink3); font-size: 11px; margin-left: auto; }
  .crowd { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; background: var(--card2, rgba(0,0,0,0.015)); font-size: 12px; color: var(--ink2); }
  .crowd .tag { font-size: 11px; color: var(--ink3); white-space: nowrap; }
  .crowd .v { font-weight: 700; font-size: 12.5px; }
  .crowd .note { margin-left: auto; font-size: 11px; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat .k { font-size: 11px; color: var(--ink3); }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .stat .d { font-size: 11px; margin-top: 2px; }

  .temp-top { display: flex; align-items: baseline; gap: 10px; }
  .temp-top .t { font-size: 40px; font-weight: 600; }
  .temp-top .l { font-size: 16px; font-weight: 600; }
  .gauge { position: relative; height: 26px; margin-top: 10px; }
  .gauge .track { position: absolute; left: 0; right: 0; top: 10px; height: 6px; background: #efedea; border-radius: 3px; }
  .gauge .mid { position: absolute; left: 50%; top: 8px; width: 1px; height: 10px; background: var(--ink4); }
  .gauge .marker { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .gauge .scale { display: flex; justify-content: space-between; margin-top: 16px; font-size: 10px; color: var(--ink4); }

  .signals { margin-top: 12px; border-top: 1px solid var(--line); }
  .sig { padding: 10px 0 9px; border-bottom: 1px solid var(--line); }
  .sig:last-child { border-bottom: none; }
  .sig .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sig .name { font-size: 13px; font-weight: 600; }
  .sig .badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sig .val { font-size: 12px; color: var(--ink2); margin: 2px 0 6px; }
  .bar { position: relative; height: 12px; }
  .bar .track { position: absolute; left: 0; right: 0; top: 4px; height: 4px; background: #efedea; border-radius: 2px; }
  .bar .tick { position: absolute; top: 3px; width: 1px; height: 6px; background: var(--line); }
  .bar .tick.midc { background: var(--ink4); }
  .bar .dot { position: absolute; top: 1px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .dot.bull { background: var(--up); } .dot.bear { background: var(--down); } .dot.zero { background: var(--ink4); }
  .sig .detail { font-size: 11px; color: var(--ink3); margin-top: 4px; line-height: 1.5; }

  .note { margin-top: 14px; }
  .note .card { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .note .sum { font-weight: 500; color: var(--ink); margin-bottom: 4px; }

  footer { margin-top: 18px; font-size: 11px; color: var(--ink4); line-height: 1.7; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>黄金ETF信号看板</h1>
    <span class="meta num" id="asOf"></span>
  </header>

  <div class="grid">
    <section class="card" aria-label="黄金ETF走势">
      <h2>黄金ETF · 518880</h2>
      <div class="hero">
        <span class="price num" id="price"></span>
        <span class="chg num" id="chg"></span>
        <span class="state" id="state"></span>
      </div>
      <svg id="chart" role="img" aria-label="黄金ETF日线走势与均线"></svg>
      <div class="legend">
        <span><i style="background:var(--ink)"></i>收盘价</span>
        <span><i style="background:var(--accent)"></i>近1月均价</span>
        <span><i style="background:var(--ink4)"></i>近3月均价</span>
      </div>
      <div class="stats">
        <div class="stat"><p class="k">国际金价</p><p class="v num" id="sComex"></p><p class="d num" id="sComexD"></p></div>
        <div class="stat"><p class="k">AU(T+D) 元/克</p><p class="v num" id="sAutd"></p><p class="d">上海金价</p></div>
        <div class="stat"><p class="k">美元指数</p><p class="v num" id="sDxy"></p><p class="d num" id="sDxyD"></p></div>
        <div class="stat"><p class="k">美元/人民币</p><p class="v num" id="sFx"></p><p class="d num" id="sFxD"></p></div>
      </div>
    </section>

    <section class="card" aria-label="黄金多空读数与信号">
      <h2>当前多空读数</h2>
      <div class="temp-top">
        <span class="t num" id="temp"></span>
        <span class="l" id="tempLabel"></span>
      </div>
      <div class="gauge">
        <div class="track"></div><div class="mid"></div>
        <div class="marker" id="marker"></div>
        <div class="scale"><span>-100 信号明显偏空</span><span>0</span><span>+100 信号明显偏多</span></div>
      </div>
      <div class="sharp" id="sharp"></div>
      <div class="crowd" id="crowd">
        <span class="tag" id="crowdTitle"></span>
        <span class="v num" id="crowdScore"></span>
        <span class="note" id="crowdNote"></span>
      </div>
      <div class="signals" id="signals"></div>
    </section>
  </div>

  <div class="note">
    <div class="card">
      <p class="sum" id="summary"></p>
      <p id="cbNote"></p>
      <p id="disclaimer" style="margin-top:6px;color:var(--ink3)">提示：上方读数是若干历史信号（多数未经验证）的合成，尚无经得起样本外检验的预测力证据，仅作了解当下市场环境的参考，不构成交易依据。</p>
    </div>
  </div>

  <footer>
    <p id="range"></p>
    <p>数据来源：腾讯行情 / 新浪财经 / 上海黄金交易所 / FRED / 世界黄金协会 · 本页为定时快照（每日 9:47、17:47 更新）· 仅供研究，不构成投资建议</p>
  </footer>
</div>

  if (etf.price != null && etf.ma20 != null && etf.ma60 != null) {
    st = etf.price > etf.ma20
      ? (etf.ma20 > etf.ma60 ? "多头排列 · 站上20日线" : "短线偏强 · 站上20日线")
      : (etf.price > etf.ma60 ? "回踩20日线 · 中线仍在" : "位于60日线下方 · 偏弱");
  }
  document.getElementById("state").textContent = st;

  // ---- chart ----
  var series = (etf.series || []).slice(-180);
  var svg = document.getElementById("chart");
  var W = 660, H = 260;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  function movingAvg(arr, win) {
    var out = [], sum = 0;
    for (var i = 0; i < arr.length; i++) {
      sum += arr[i].close;
      if (i >= win) sum -= arr[i - win].close;
      out.push(i >= win - 1 ? sum / win : null);
    }
    return out;
  }
  var ma20 = movingAvg(series, 20), ma60 = movingAvg(series, 60);
  var vals = series.map(function (p) { return p.close; })
    .concat(ma20.filter(function (v) { return v != null; }))
    .concat(ma60.filter(function (v) { return v != null; }));
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var span = (max - min) || 1; min -= span * 0.04; max += span * 0.04;
  var padL = 6, padR = 52, padT = 10, padB = 20, iw = W - padL - padR, ih = H - padT - padB;
  function X(i) { return padL + (i / (series.length - 1)) * iw; }
  function Y(v) { return padT + (1 - (v - min) / (max - min)) * ih; }
  var ns = "http://www.w3.org/2000/svg";
  function el(tag, attrs) { var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function text(x, y, str, anchor, klass) {
    var t = el("text", { x: x, y: y, "text-anchor": anchor || "start", "class": klass || "axis-text" });
    t.textContent = str; return t;
  }
  for (var g = 0; g <= 4; g++) {
    var gv = min + (max - min) * g / 4;
    svg.appendChild(el("line", { x1: padL, x2: W - padR, y1: Y(gv), y2: Y(gv), "class": "grid-line" }));
    svg.appendChild(text(padL + 2, Y(gv) - 3, gv.toFixed(2)));
  }
  function path(get) {
    var d = "";
    for (var i = 0; i < series.length; i++) {
      var v = get(i); if (v == null) continue;
      d += (d ? " L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
    }
    return d;
  }
  svg.appendChild(el("path", { d: path(function (i) { return ma60[i]; }), "class": "ma60-line" }));
  svg.appendChild(el("path", { d: path(function (i) { return ma20[i]; }), "class": "ma20-line" }));
  svg.appendChild(el("path", { d: path(function (i) { return series[i].close; }), "class": "price-line" }));
  var li = series.length - 1, last = series[li].close, upCol = etf.chgPct > 0 ? "var(--up)" : "var(--down)";
  svg.appendChild(el("circle", { cx: X(li), cy: Y(last), r: 3, fill: upCol }));
  svg.appendChild(text(W - padR + 6, Y(last) + 3.5, last.toFixed(3), "start", "last-label")).setAttribute("fill", upCol);
  if (ma20[li] != null) svg.appendChild(text(W - padR + 6, Y(ma20[li]) + 3.5, ma20[li].toFixed(2), "start", "last-label")).setAttribute("fill", "var(--accent)");
  [0, Math.floor(li / 2), li].forEach(function (idx, q) {
    svg.appendChild(text(X(idx), H - 5, series[idx].date.slice(5), idx === li ? "end" : (idx === 0 ? "start" : "middle")));
  });

  // ---- stats ----
  function setDelta(id, v) {
    var e = document.getElementById(id);
    e.textContent = v == null ? "—" : "20日 " + signed(v, 1, "%");
    e.className = "d num " + cls(v);
  }
  document.getElementById("sComex").textContent = DATA.comex.price ? "$" + Number(DATA.comex.price).toLocaleString("en-US", { maximumFractionDigits: 0 }) : "—";
  setDelta("sComexD", DATA.comex.mom20Pct);
  document.getElementById("sAutd").textContent = DATA.autd && DATA.autd.price ? "¥" + Number(DATA.autd.price).toFixed(1) : "—";
  document.getElementById("sDxy").textContent = DATA.dxy.price ? Number(DATA.dxy.price).toFixed(2) : "—";
  setDelta("sDxyD", DATA.dxy.chg20dPct);
  document.getElementById("sFx").textContent = DATA.fx.usdcny ? Number(DATA.fx.usdcny).toFixed(4) : "—";
  setDelta("sFxD", DATA.fx.chg20dPct);
  document.getElementById("range").textContent = "52周区间 " + Number(etf.low52w).toFixed(3) + " – " + Number(etf.high52w).toFixed(3);

  // ---- temperature ----
  var c = DATA.composite;
  var temp = document.getElementById("temp");
  temp.textContent = (c.score > 0 ? "+" : "") + c.score;
  temp.className = "t num " + cls(c.score);
  var lbl = document.getElementById("tempLabel");
  lbl.textContent = c.label;
  lbl.className = "l " + cls(c.score);
  var marker = document.getElementById("marker");
  marker.style.left = ((c.score + 100) / 2) + "%";
  marker.style.background = c.score > 0 ? "var(--up)" : (c.score < 0 ? "var(--down)" : "var(--ink4)");

  // ---- 市况参考（按市况切换：趋势市→专业基金押注 / 震荡市→金价波动预期，2026-09-17）----
  var sharpBox = document.getElementById("sharp");
  if (c.sharp && sharpBox) {
    var name = c.sharp.name || "专业基金押注";   // 兼容旧快照
    var regime = c.sharp.regime || "";
    var tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = regime ? ("市况参考（" + regime + "）· " + name) : ("市况参考 · " + name);
    var v = document.createElement("span"); v.className = "v num " + cls(c.sharp.score);
    v.textContent = (c.sharp.score > 0 ? "+" : "") + c.sharp.score + " " + c.sharp.label;
    var note = document.createElement("span"); note.className = "note"; note.textContent = c.sharp.note;
    sharpBox.appendChild(tag); sharpBox.appendChild(v); sharpBox.appendChild(note);
  } else if (sharpBox) {
    sharpBox.style.display = "none";
  }

  // ---- 市场全貌·拥挤度（eq8 8 因子叙事温度，仅供参考，2026-09-25）----
  var crowdBox = document.getElementById("crowd");
  if (crowdBox && c.narrative) {
    document.getElementById("crowdTitle").textContent = "市场全貌·拥挤度（8因子叙事温度，仅供参考）";
    var cs = document.getElementById("crowdScore");
    cs.textContent = (c.narrative.score > 0 ? "+" : "") + c.narrative.score;
    cs.className = "v num " + cls(c.narrative.score);
    var cn = document.getElementById("crowdNote");
    if (c.narrative.crowdAlert) {
      cn.textContent = "⚠️ 全市场看涨共识·别追高";
      cn.style.color = "var(--up)";
    } else {
      cn.textContent = "无拥挤";
    }
  } else if (crowdBox) {
    crowdBox.style.display = "none";
  }

  // ---- signals ----
  var box = document.getElementById("signals");
  DATA.signals.forEach(function (s) {
    var row = document.createElement("div"); row.className = "sig";
    var l1 = document.createElement("div"); l1.className = "l1";
    var name = document.createElement("span"); name.className = "name"; name.textContent = s.name;
    var badge = document.createElement("span"); badge.className = "badge num " + cls(s.score);
    badge.textContent = (s.score > 0 ? "+" : "") + s.score + " " + word(s.score);
    l1.appendChild(name); l1.appendChild(badge);
    var val = document.createElement("p"); val.className = "val num"; val.textContent = s.value || "—";
    var bar = document.createElement("div"); bar.className = "bar";
    bar.innerHTML = '<div class="track"></div>';
    [-2, -1, 0, 1, 2].forEach(function (t) {
      var tick = document.createElement("div");
      tick.className = "tick" + (t === 0 ? " midc" : "");
      tick.style.left = ((t + 2) / 4 * 100) + "%";
      bar.appendChild(tick);
    });
    var dot = document.createElement("div");
    dot.className = "dot " + (s.score > 0 ? "bull" : (s.score < 0 ? "bear" : "zero"));
    dot.style.left = ((s.score + 2) / 4 * 100) + "%";
    bar.appendChild(dot);
    var detail = document.createElement("p"); detail.className = "detail"; detail.textContent = s.detail || "";
    row.appendChild(l1); row.appendChild(val); row.appendChild(bar); row.appendChild(detail);
    box.appendChild(row);
  });

  document.getElementById("summary").textContent = c.summary || "";
  document.getElementById("cbNote").textContent = (DATA.centralBank && DATA.centralBank.note) || "";
})();
</script>
</body>
</html>
