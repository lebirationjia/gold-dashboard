<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金ETF信号看板</title>
<style>
  :root {
    --bg: #faf9f7; --ink: #1c1b1a; --ink2: #57534e; --ink3: #8a8580; --ink4: #b5b0aa;
    --line: #e6e2dc; --card: #ffffff; --up: #d92d20; --down: #12805c; --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    padding: 24px 16px 40px;
  }
  .page { max-width: 1060px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  header.top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  header.top h1 { font-size: 21px; font-weight: 600; }
  header.top .meta { font-size: 12px; color: var(--ink3); }

  .grid { display: grid; grid-template-columns: 7fr 5fr; gap: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }

  .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero .price { font-size: 36px; font-weight: 600; }
  .chg { font-size: 14px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink2); }
  .hero .state { font-size: 12px; color: var(--ink3); }
  .card h2 { font-size: 13px; font-weight: 500; color: var(--ink3); margin-bottom: 8px; }

  #chart { width: 100%; display: block; margin-top: 12px; }
  .grid-line { stroke: var(--line); stroke-width: 1; }
  .axis-text { fill: var(--ink4); font-size: 10px; }
  .price-line { stroke: var(--ink); stroke-width: 2; fill: none; }
  .ma20-line { stroke: var(--accent); stroke-width: 1.5; fill: none; }
  .ma60-line { stroke: var(--ink4); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  .last-label { font-size: 10.5px; font-weight: 600; }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--ink3); }
  .legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat .k { font-size: 11px; color: var(--ink3); }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .stat .d { font-size: 11px; margin-top: 2px; }

  .temp-top { display: flex; align-items: baseline; gap: 10px; }
  .temp-top .t { font-size: 40px; font-weight: 600; }
  .temp-top .l { font-size: 16px; font-weight: 600; }
  .gauge { position: relative; height: 26px; margin-top: 10px; }
  .gauge .track { position: absolute; left: 0; right: 0; top: 10px; height: 6px; background: #efedea; border-radius: 3px; }
  .gauge .mid { position: absolute; left: 50%; top: 8px; width: 1px; height: 10px; background: var(--ink4); }
  .gauge .marker { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .gauge .scale { display: flex; justify-content: space-between; margin-top: 16px; font-size: 10px; color: var(--ink4); }

  .signals { margin-top: 12px; border-top: 1px solid var(--line); }
  .sig { padding: 10px 0 9px; border-bottom: 1px solid var(--line); }
  .sig:last-child { border-bottom: none; }
  .sig .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sig .name { font-size: 13px; font-weight: 600; }
  .sig .badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sig .val { font-size: 12px; color: var(--ink2); margin: 2px 0 6px; }
  .bar { position: relative; height: 12px; }
  .bar .track { position: absolute; left: 0; right: 0; top: 4px; height: 4px; background: #efedea; border-radius: 2px; }
  .bar .tick { position: absolute; top: 3px; width: 1px; height: 6px; background: var(--line); }
  .bar .tick.midc { background: var(--ink4); }
  .bar .dot { position: absolute; top: 1px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .dot.bull { background: var(--up); } .dot.bear { background: var(--down); } .dot.zero { background: var(--ink4); }
  .sig .detail { font-size: 11px; color: var(--ink3); margin-top: 4px; line-height: 1.5; }

  .note { margin-top: 14px; }
  .note .card { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .note .sum { font-weight: 500; color: var(--ink); margin-bottom: 4px; }

  footer { margin-top: 18px; font-size: 11px; color: var(--ink4); line-height: 1.7; }
</style>
</head>
